<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actus GTA 6 : trailers, prix, annonces Rockstar, mises à jour 2 fois par jour</title>
  <meta name="description" content="Toutes les actualités de Grand Theft Auto VI : annonces officielles Rockstar, Extended Look, prix, précommandes, et la presse du monde entier en 12 langues, mise à jour automatique 2 fois par jour.">
  <link rel="canonical" href="https://stesouna9.github.io/gta6-countdown/actus.html">
  <meta property="og:title" content="Actus GTA 6"><meta property="og:image" content="https://img.youtube.com/vi/tJbzMqJGH4k/maxresdefault.jpg">
  <link rel="stylesheet" href="assets/style.css"><script src="assets/i18n.js"></script>
</head>
<body>

  <header class="tete-page image"><img src="https://img.youtube.com/vi/VQRLujxTm3c/maxresdefault.jpg" alt=""><div class="wrap">
    <span class="kicker">Leonida · <span id="maj-date"></span></span>
    <h1 data-i18n="news_t"></h1><p data-i18n="news_i"></p></div></header>
  <section class="papier"><div class="wrap">
    <div class="rubrique rv"><span class="num">01</span><h2 data-i18n="news_press"></h2><p data-i18n="updated"></p></div>
    <div class="journal" id="presse"></div>
  </div></section>
  <div class="pub vide"></div>
  <section class="papier" style="background:var(--paper2)"><div class="wrap">
    <div class="rubrique rv"><span class="num">02</span><h2 data-i18n="news_official"></h2></div>
    <div class="officiel" id="officiel"></div>
  </div></section>
  <section><div class="wrap">
    <div class="rubrique rv"><span class="num">03</span><h2 data-i18n="news_videos"></h2></div>
    <div class="videos" id="videos"></div>
  </div></section>
  <section style="padding-top:0"><div class="wrap">
    <div class="rubrique rv"><span class="num">04</span><h2 data-i18n="news_sources"></h2></div>
    <div class="sources">
      <a href="https://www.rockstargames.com/newswire" target="_blank" rel="noopener"><b>Rockstar Newswire</b><span>rockstargames.com/newswire</span></a>
      <a href="https://www.rockstargames.com/VI" target="_blank" rel="noopener"><b>Rockstar · VI</b><span>rockstargames.com/VI</span></a>
      <a href="https://www.youtube.com/@RockstarGames" target="_blank" rel="noopener"><b>YouTube</b><span>@RockstarGames</span></a>
      <a href="https://x.com/RockstarGames" target="_blank" rel="noopener"><b>X</b><span>@RockstarGames</span></a>
      <a href="https://www.reddit.com/r/GTA6/" target="_blank" rel="noopener"><b>Reddit</b><span>r/GTA6</span></a>
      <a href="https://www.gtabase.com/gta-6/" target="_blank" rel="noopener"><b>GTABase</b><span>gtabase.com</span></a>
    </div>
  </div></section>
  <script src="assets/site.js"></script>
  <script>
    chargeActus(document.getElementById("presse"), 16, true);
    fetch("data/meta.json").then(function (r) { return r.json(); }).then(function (m) { document.getElementById("maj-date").textContent = new Date(m.maj).toLocaleString(); }).catch(function () {});
    fetch("actus.json").then(function (r) { return r.json(); }).then(function (lst) {
      document.getElementById("officiel").innerHTML = lst.map(function (a) {
        return '<a href="' + a.lien + '" target="_blank" rel="noopener"><span class="d">' + a.date.split("-").reverse().join(".") + " · " + a.tag + '</span><b>' + a.titre + '</b><p>' + a.texte + '</p></a>';
      }).join("");
    });
    fetch("data/videos.json").then(function (r) { return r.json(); }).then(function (lst) {
      document.getElementById("videos").innerHTML = lst.map(function (v, i) {
        return '<div class="film" data-video="' + v.id + '" role="button" tabindex="0"><div class="cadre"><img src="https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg" alt="" loading="lazy"><span class="play"></span></div><div class="legende"><span class="n">' + String(i + 1).padStart(2, "0") + '</span><b>' + v.t + '</b><small>' + v.d.split("-").reverse().join(".") + '</small></div></div>';
      }).join("");
    });
  </script>
</body>
</html>
