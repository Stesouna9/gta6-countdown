name: traduction
on:
  schedule:
    - cron: "45 * * * *"   # toutes les heures (UTC), après la routine Solange
  push:                    # article publié → image et traductions tout de suite (pas d'image cassée)
    branches: [main]
    paths: [data/articles.json, tools/i18n/en.json]
  workflow_dispatch:
    inputs:
      test: { type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: gta6-push, cancel-in-progress: false }
jobs:
  traduire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests pillow
      - if: ${{ inputs.test }}
        run: python tools/traduire.py --test
      - if: ${{ !inputs.test }}
        run: python tools/img_auto.py | tee /tmp/img.log   # AVANT la traduction (longue) : jamais d'article sans photo ; photo trouvée par mot-clé (champ kw) pour les nouveaux articles
      - if: ${{ !inputs.test }}
        run: python tools/traduire.py 20 | tee /tmp/trad.log; python tools/traduire_i18n.py | tee -a /tmp/trad.log   # articles + textes fixes du site, 17 langues
      - if: ${{ !inputs.test }}
        run: |
          grep -q "^traduit" /tmp/trad.log || grep -q "^i18n traduit : [a-z]" /tmp/trad.log || grep -q "^[1-9][0-9]* image" /tmp/img.log || exit 0
          python tools/prerender.py && python tools/pub.py
          git config user.name "gta6-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Solange traduction : $(grep '^traduit' /tmp/trad.log | cut -c11-200)"
          # conflit (quelqu'un a poussé pendant la traduction) : garder nos lignes, régénérer les pages, réessayer
          for i in 1 2 3; do
            git pull --rebase -q -X theirs origin main || { git rebase --abort; git pull --rebase -q -X theirs origin main; } || true
            python tools/prerender.py >/dev/null && python tools/pub.py >/dev/null
            git add -A; git diff --cached --quiet || git commit -qm "régénération après fusion"
            git push && break; sleep 10
          done
