name: pages
# 05/11/2026 : le site est servi par le serveur (git pull), Pages ne sert qu'à rediriger github.io vers gtavifrance.com.
# Une fois par jour au lieu d'un déploiement par push : plus de collisions « in progress deployment » ni de mails d'échec.
on:
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:
concurrency: { group: pages, cancel-in-progress: false }
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
