name: Revue de presse pour Solange
on:
  schedule:
    - cron: "3,33 * * * *"   # toutes les 30 min (UTC) : à l'affût de GTA 6 et Cyberleek, avant la routine Solange
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: presse, cancel-in-progress: false }
jobs:
  presse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/presse.py
      - run: python tools/veille.py data/veille.json || true
      - run: |
          git config user.name "gta6-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/presse.json data/veille.json
          git diff --cached --quiet || git commit -m "presse: revue de presse $(date -u +%F' '%H:%M)"
          git pull --rebase -q origin main || true
          git push
