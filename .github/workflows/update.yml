name: Mise à jour actus, vidéos et offres
on:
  schedule:
    - cron: "17 5,17 * * *"   # 2 fois par jour (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pillow
      - run: python tools/update.py && python tools/images.py && python tools/prerender.py
      - run: |
          git config user.name "gta6-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || git commit -m "data: mise à jour automatique $(date -u +%F' '%H:%M)"
          git push
      - name: IndexNow (Bing, Yandex, Naver, Seznam)
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          host = urls[0].split("/")[2]; base = urls[0]
          body = json.dumps({"host": "gtavifrance.com", "key": "17bf4b50ddfe396b52df541315db512c", "keyLocation": base + "17bf4b50ddfe396b52df541315db512c.txt", "urlList": urls}).encode()
          r = urllib.request.urlopen(urllib.request.Request("https://api.indexnow.org/indexnow", body, {"Content-Type": "application/json"}), timeout=30)
          print("indexnow", r.status, len(urls), "URL")
          PY
