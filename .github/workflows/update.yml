name: Mise à jour actus, vidéos et offres
on:
  schedule:
    - cron: "17 5,17 * * *"   # 2 fois par jour (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/update.py && python tools/prerender.py
      - run: |
          git config user.name "gta6-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data sitemap.xml feed.xml *.html
          git diff --cached --quiet || git commit -m "data: mise à jour automatique $(date -u +%F' '%H:%M)"
          git push
